<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SatyaScan - Microphone Access</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background-color: #F6F4EB;
      color: #232B1B;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 24px;
      box-sizing: border-box;
    }
    .card {
      background: #E4DFB5;
      border: 1px solid #C3CC9B;
      border-radius: 20px;
      padding: 36px 32px;
      max-width: 440px;
      width: 100%;
      text-align: center;
      box-shadow: 0 10px 25px -5px rgba(35, 43, 27, 0.08);
    }
    .icon {
      font-size: 44px;
      margin-bottom: 16px;
    }
    h1 {
      margin: 0 0 12px 0;
      font-size: 22px;
      font-weight: 800;
      color: #232B1B;
    }
    p {
      margin: 0 0 24px 0;
      font-size: 14px;
      color: #5C6650;
      line-height: 1.6;
    }
    .btn {
      background: #232B1B;
      color: #FBE8CE;
      border: none;
      border-radius: 12px;
      padding: 12px 28px;
      font-weight: 800;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn:hover {
      background: #343F29;
      transform: translateY(-1px);
    }
    .status {
      margin-top: 18px;
      font-size: 13px;
      font-weight: 600;
      min-height: 20px;
      line-height: 1.5;
    }
    .success {
      color: #2E7D32;
    }
    .error {
      color: #C62828;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">🎙️</div>
    <h1>Enable Microphone</h1>
    <p>Please click <strong>"Allow"</strong> when Chrome prompts for microphone permission so you can dictate claims directly in the SatyaScan extension.</p>
    <button id="btnAllow" class="btn">Grant Microphone Permission</button>
    <div id="status" class="status"></div>
  </div>
  <script src="permission.js"></script>
</body>
</html>
